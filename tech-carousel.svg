<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="160" viewBox="0 0 1000 160">
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="card" x1="0" x2="1">
      <stop offset="0%" stop-color="#12051f"/>
      <stop offset="100%" stop-color="#24103b"/>
    </linearGradient>

    <style>
      .card { fill:url(#card); stroke:#8b5cf6; stroke-width:1.5; }
      .name { fill:#f5f3ff; font-family:Arial,Helvetica,sans-serif; font-size:16px; font-weight:700; }
      .sub  { fill:#c4b5fd; font-family:Arial,Helvetica,sans-serif; font-size:11px; }
      .logo { font-family:Arial,Helvetica,sans-serif; font-weight:900; text-anchor:middle; dominant-baseline:middle; }
    </style>
  </defs>

  <!-- transparent background -->
  <rect width="1000" height="160" fill="transparent"/>

  <!-- first moving row -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      from="0 0" to="-950 0" dur="16s" repeatCount="indefinite"/>

    <!-- HTML -->
    <g transform="translate(25 25)">
      <rect class="card" rx="18" width="160" height="110"/>
      <path d="M55 20h50l-5 58-20 7-20-7z" fill="#e44d26"/>
      <path d="M80 25h20l-4 48-16 6z" fill="#f16529"/>
      <text x="80" y="54" class="logo" fill="#fff" font-size="20">5</text>
      <text x="80" y="96" class="name" text-anchor="middle">HTML</text>
    </g>

    <!-- CSS -->
    <g transform="translate(215 25)">
      <rect class="card" rx="18" width="160" height="110"/>
      <path d="M55 20h50l-5 58-20 7-20-7z" fill="#264de4"/>
      <path d="M80 25h20l-4 48-16 6z" fill="#2965f1"/>
      <text x="80" y="54" class="logo" fill="#fff" font-size="18">3</text>
      <text x="80" y="96" class="name" text-anchor="middle">CSS</text>
    </g>

    <!-- C# -->
    <g transform="translate(405 25)">
      <rect class="card" rx="18" width="160" height="110"/>
      <circle cx="80" cy="48" r="29" fill="#7c3aed" filter="url(#glow)"/>
      <text x="80" y="50" class="logo" fill="#fff" font-size="24">C#</text>
      <text x="80" y="96" class="name" text-anchor="middle">C#</text>
    </g>

    <!-- JavaScript -->
    <g transform="translate(595 25)">
      <rect class="card" rx="18" width="160" height="110"/>
      <rect x="52" y="19" width="56" height="56" rx="9" fill="#f7df1e"/>
      <text x="80" y="51" class="logo" fill="#171717" font-size="22">JS</text>
      <text x="80" y="96" class="name" text-anchor="middle">JavaScript</text>
    </g>

    <!-- Python -->
    <g transform="translate(785 25)">
      <rect class="card" rx="18" width="160" height="110"/>
      <circle cx="69" cy="43" r="22" fill="#3776ab"/>
      <circle cx="91" cy="57" r="22" fill="#ffd343"/>
      <text x="80" y="51" class="logo" fill="#fff" font-size="18">Py</text>
      <text x="80" y="96" class="name" text-anchor="middle">Python</text>
    </g>
  </g>

  <!-- duplicated row for seamless loop -->
  <g transform="translate(950 0)">
    <animateTransform attributeName="transform" type="translate"
      additive="sum" from="0 0" to="-950 0" dur="16s" repeatCount="indefinite"/>

    <g transform="translate(25 25)">
      <rect class="card" rx="18" width="160" height="110"/>
      <path d="M55 20h50l-5 58-20 7-20-7z" fill="#e44d26"/>
      <path d="M80 25h20l-4 48-16 6z" fill="#f16529"/>
      <text x="80" y="54" class="logo" fill="#fff" font-size="20">5</text>
      <text x="80" y="96" class="name" text-anchor="middle">HTML</text>
    </g>

    <g transform="translate(215 25)">
      <rect class="card" rx="18" width="160" height="110"/>
      <path d="M55 20h50l-5 58-20 7-20-7z" fill="#264de4"/>
      <path d="M80 25h20l-4 48-16 6z" fill="#2965f1"/>
      <text x="80" y="54" class="logo" fill="#fff" font-size="18">3</text>
      <text x="80" y="96" class="name" text-anchor="middle">CSS</text>
    </g>

    <g transform="translate(405 25)">
      <rect class="card" rx="18" width="160" height="110"/>
      <circle cx="80" cy="48" r="29" fill="#7c3aed" filter="url(#glow)"/>
      <text x="80" y="50" class="logo" fill="#fff" font-size="24">C#</text>
      <text x="80" y="96" class="name" text-anchor="middle">C#</text>
    </g>

    <g transform="translate(595 25)">
      <rect class="card" rx="18" width="160" height="110"/>
      <rect x="52" y="19" width="56" height="56" rx="9" fill="#f7df1e"/>
      <text x="80" y="51" class="logo" fill="#171717" font-size="22">JS</text>
      <text x="80" y="96" class="name" text-anchor="middle">JavaScript</text>
    </g>

    <g transform="translate(785 25)">
      <rect class="card" rx="18" width="160" height="110"/>
      <circle cx="69" cy="43" r="22" fill="#3776ab"/>
      <circle cx="91" cy="57" r="22" fill="#ffd343"/>
      <text x="80" y="51" class="logo" fill="#fff" font-size="18">Py</text>
      <text x="80" y="96" class="name" text-anchor="middle">Python</text>
    </g>
  </g>
</svg>