<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img"><title>perfil</title><defs><linearGradient id="g" x2="1" y2="1"><stop stop-color="#2563EB"/><stop offset="1" stop-color="#00E5C3"/></linearGradient></defs><rect x="14" y="21" width="936" height="226" rx="24" fill="#060B14" stroke="#060B14"/><rect x="12" y="12" width="936" height="226" rx="24" fill="#151F35" stroke="#2B3B55"/><text x="42" y="50" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="600" fill="#48E5D0">01 / SOBRE MIM</text><text x="42" y="93" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" font-weight="700" fill="#F4F7FF">Tecnologia, estudo e novos projetos.</text><text x="42" y="136" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400" fill="#CBD5E1">Sou apaixonado por tecnologia e busco desenvolver</text><text x="42" y="168" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400" fill="#CBD5E1">continuamente meus conhecimentos na área. Tenho interesse</text><text x="42" y="200" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400" fill="#CBD5E1">em desenvolvimento de software e em ampliar minhas habilidades.</text><rect x="14" y="272" width="454" height="190" rx="24" fill="#060B14" stroke="#060B14"/><rect x="12" y="263" width="454" height="190" rx="24" fill="#151F35" stroke="#2B3B55"/><text x="42" y="304" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="600" fill="#48E5D0">02 / FORMAÇÃO</text><text x="42" y="352" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="700" fill="#F4F7FF">Ciências da Computação</text><text x="42" y="390" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#CBD5E1">UNICID</text><text x="42" y="425" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#8EA4C5">Graduação em andamento</text><rect x="488" y="272" width="462" height="190" rx="24" fill="#060B14" stroke="#060B14"/><rect x="486" y="263" width="462" height="190" rx="24" fill="#151F35" stroke="#2B3B55"/><text x="516" y="304" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="600" fill="#48E5D0">03 / DIREÇÃO</text><text x="516" y="352" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="700" fill="#F4F7FF">Desenvolvimento</text><text x="516" y="386" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="700" fill="#F4F7FF">de software</text><text x="516" y="425" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#8EA4C5">Aprendizado contínuo</text></svg>