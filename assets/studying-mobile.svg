<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="520" height="296" viewBox="0 0 520 296" role="img" aria-labelledby="title desc">
  <title id="title">Estudos: Ciências da Computação, Desenvolvimento Web, Desenvolvimento FullStack, Lógica e Fundamentos de Programação, Boas Práticas de Desenvolvimento, Novas Tecnologias</title>
  <desc id="desc">Design do perfil de João Victor Gobi Romero. Animações decorativas em SVG, com suporte a movimento reduzido.</desc>
  <defs></defs>
  <style>
    text { font-family: 'Segoe UI',Arial,'Liberation Sans',sans-serif; }
    .mono { font-family: 'Cascadia Code','SFMono-Regular',Consolas,'Liberation Mono',monospace; }
    
  @keyframes hover { 0%,100% {transform:translateY(0)} 50% {transform:translateY(-7px)} }
  @keyframes glow { 0%,100% {opacity:.4} 50% {opacity:1} }
  @keyframes blink { 0%,44%,100% {opacity:1} 45%,80% {opacity:.12} }
  @keyframes signal { 0% {stroke-dashoffset:160} 100% {stroke-dashoffset:0} }
  .floating { animation:hover 6s ease-in-out infinite; }
  .floating-late { animation:hover 7.5s ease-in-out -2s infinite; }
  .glow { animation:glow 4s ease-in-out infinite; }
  .cursor { animation:blink 1.25s step-end infinite; }
  .signal { stroke-dasharray:12 68; animation:signal 8s linear infinite; }
  @media (prefers-reduced-motion:reduce) {
    .floating,.floating-late,.glow,.cursor,.signal {animation:none!important}
  }

      @keyframes topic { 0%,16.65% {opacity:1} 16.6667%,100% {opacity:0} }
      @keyframes type { 0% {clip-path:inset(0 100% 0 0)} 45%,87% {clip-path:inset(0 0 0 0)} 100% {clip-path:inset(0 100% 0 0)} }
      @keyframes progress {from {stroke-dashoffset:1} to {stroke-dashoffset:0}}
      .topic {opacity:0;animation:topic 30s linear infinite}
      .topic-0 {opacity:1}
      .typing {clip-path:inset(0 0 0 0);transform-box:fill-box;animation:type 5s steps(36,end) infinite}
      .progress {stroke-dasharray:900;animation:glow 5s ease-in-out infinite}
      @media (prefers-reduced-motion:reduce) {
        .topic,.typing,.progress {animation:none!important}
        .topic {opacity:0} .topic-0 {opacity:1}
        .typing {clip-path:none}
      }
    .topic-1 {animation-delay:-25s}
.topic-2 {animation-delay:-20s}
.topic-3 {animation-delay:-15s}
.topic-4 {animation-delay:-10s}
.topic-5 {animation-delay:-5s}

  </style>
